[package]
name = "samsmrti"
version = "0.1.0"
edition = "2021"
description = "A modern spaced repetition app"
default-run = "samsmrti"

[lib]
name = "samsmrti_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
# Pure-Rust (miniz_oxide) backend by default -- verified in the Phase 0 spike
# to compile fine for wasm32-unknown-unknown, unlike `zip` below.
flate2 = "1"

# Native (desktop, CLI import binaries): bundled C SQLite, real filesystem/tempfile access.
# zip lives here (not in wasm32 deps yet) -- its default xz support pulls in
# lzma-sys, a C library that doesn't cross-compile to wasm32-unknown-unknown
# out of the box. backup/full.rs and import/apkg.rs (the only callers) are
# themselves still native-only pending their in-memory rewrite; revisit zip's
# feature flags (or upgrade to zip 8.x's pure-Rust lzma backend) when that
# work happens.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
dirs = "6"
zip = "2"

# wasm32 (browser core, used by both the PWA and eventually the desktop webview):
# rusqlite's default `ffi-sqlite-wasm-rs` backend instead of a bundled native build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Verified in the Phase 0 spike: real CRUD + recursive CTE + FTS5 all work
# on wasm32-unknown-unknown with rusqlite's own default feature set here.
rusqlite = { version = "0.40" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# uuid v4 needs an explicit randomness source on this target; browser crypto via getrandom's "js" backend.
uuid = { version = "1", features = ["js"] }

[[bin]]
name = "import_anki"
path = "src/bin/import_anki.rs"

[[bin]]
name = "import_senators"
path = "src/bin/import_senators.rs"

[[bin]]
name = "import_quizbowl"
path = "src/bin/import_quizbowl.rs"
